name: tbn_lms
description: Tungabadra Networks — Enterprise Learning Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──
  flutter_riverpod: ^2.6.1

  # ── Navigation ──
  go_router: ^14.8.1

  # ── Dependency Injection ──
  get_it: ^8.0.2
  injectable: ^2.5.0

  # ── Network ──
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # ── Storage ──
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.3
  path_provider: ^2.1.5

  # ── UI & Design ──
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1

  # ── Media ──
  video_player: ^2.9.2
  chewie: ^1.8.5
  youtube_player_flutter: ^10.0.1
  flutter_pdfview: ^1.4.0

  # ── Payments ──
  razorpay_flutter: ^1.3.7

  # ── Device Services ──
  local_auth: ^2.3.0
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  share_plus: ^12.0.2
  image_picker: ^1.1.2
  file_picker: ^11.0.3
  url_launcher: ^6.3.1

  # ── Utilities ──
  intl: ^0.19.0
  uuid: ^4.5.1
  logger: ^2.5.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  timeago: ^3.7.0
  flutter_dotenv: ^5.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.4
  build_runner: ^2.4.14
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/
